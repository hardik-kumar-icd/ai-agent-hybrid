<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor AI Widget - Development Test</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <h1>Visor AI Widget - Development Test</h1>
  <p>This page loads the widget from the React development server.</p>
  
  <!-- Widget Container -->
  <div id="visor-ai-widget"
       data-base-url="https://sinkerless-sententially-abrielle.ngrok-free.dev"
       data-admin="false">
  </div>

  <!-- Load React from CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Load widget code from development server -->
  <!-- IMPORTANT: Start React dev server first: cd client && npm start -->
  <script type="module">
    // Import the widget initialization function
    // This will only work if you're running npm start and accessing via localhost
    import { default as widgetModule } from 'http://localhost:3000/src/widget.js';
    
    // Wait for DOM to be ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initWidget);
    } else {
      initWidget();
    }
    
    function initWidget() {
      if (window.VisorAIWidget && window.VisorAIWidget.initFromElement) {
        window.VisorAIWidget.initFromElement('#visor-ai-widget');
      } else {
        console.error('Widget not loaded. Make sure React dev server is running on localhost:3000');
      }
    }
  </script>
</body>
</html>
