# ============================================================================
# Nginx site config for agent.visor.no
#
# Updates in this version (vs. the deploy PR):
#   1. Added proper /widget.bundle.umd.js + /widget.bundle.css alias blocks
#   2. SSE streaming support for /visor-chat/stream (proxy_buffering off,
#      X-Accel-Buffering: no, longer timeout)
#   3. Removed unused /widget.js → Node proxy (replaced by alias to disk)
#
# SSL is added automatically by certbot via 05-setup-ssl.sh.
# ============================================================================

# Rate/connection limiting zones (must be defined in the http{} context —
# this file is included from nginx.conf's http block via sites-enabled/).
# Drops floods at the nginx layer before they ever reach the Node process,
# on top of the app-level rate limiters in server/middlewares/rateLimiter.js.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

server {
    listen 80;
    listen [::]:80;
    server_name agent.visor.no;

    # React build (CRA app + admin UI). The widget bundle (UMD) lives
    # in client/dist/ and is served via dedicated alias blocks below.
    root /var/www/visor-agent/client/build;
    index index.html;

    # Body size for ingest uploads
    client_max_body_size 25M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # ---------- Widget bundle (UMD) — served from disk with CORS ----------
    # Vite builds these into client/dist/. Cross-origin embeddable, so
    # we set Allow-Origin: * (script-src CORS isn't strictly required for
    # <script src=...> tags but it makes fetch()-based loaders work too).

    location = /widget.bundle.umd.js {
        alias /var/www/visor-agent/client/dist/widget.bundle.umd.js;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Cache-Control "public, max-age=3600" always;
        expires 1h;
    }

    location = /widget.bundle.css {
        alias /var/www/visor-agent/client/dist/widget.bundle.css;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
        expires 1h;
    }

    # Backward-compat: serve old /widget.js path from the same bundle
    location = /widget.js {
        alias /var/www/visor-agent/client/dist/widget.bundle.umd.js;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # ---------- SSE streaming endpoint — buffering OFF, longer timeout ----------
    location = /visor-chat/stream {
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn addr_limit 10;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRITICAL for SSE: disable buffering so tokens reach the client immediately
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;

        # Longer timeout for streaming (LLM can think for a while)
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_connect_timeout 30s;

        # Keep connection alive
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }

    # ---------- Other API routes → Node app (buffered, normal) ----------
    location ~ ^/(visor-chat|chat|api|ingest|rag|admin-api) {
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn addr_limit 10;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
    }

    # React static assets — cache aggressively
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    server_tokens off;
}
