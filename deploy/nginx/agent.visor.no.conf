# ============================================================================
# Nginx site config for agent.visor.no
# Reverse proxy -> Node app on port 5000, serves React build statically.
# SSL is added automatically by certbot in 05-setup-ssl.sh.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name agent.visor.no;

    # React build (widget + admin UI)
    root /var/www/visor-agent/client/build;
    index index.html;

    # Body size for ingest uploads
    client_max_body_size 25M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # ---------- API routes -> Node app ----------
    location ~ ^/(visor-chat|chat|api|ingest|rag|test-woocommerce|admin-api) {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
    }

    # Widget JS bundle (if served by Node)
    location = /widget.js {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # React static assets — cache aggressively
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hide server version
    server_tokens off;
}
